<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 104" width="100%" height="104" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.15s step-end infinite;
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="103" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1" />

  <!-- Left: Name & Subtitle -->
  <text x="28" y="45" fill="#f0f6fc" font-size="21" font-weight="600" letter-spacing="-0.4" class="sans">Devesh Kolte</text>
  <text x="28" y="70" fill="#8b949e" font-size="13" class="sans">Building deterministic AI tooling, agent infrastructure, and full-stack products.</text>

  <!-- Right: Minimal Monospace Prompt -->
  <rect x="596" y="33" width="236" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="612" y="56" fill="#6e7681" font-size="12" class="mono">$</text>
  <text x="626" y="56" fill="#e6edf3" font-size="12" class="mono">uvx ragmortem demo</text>
  <rect x="762" y="44.5" width="6.5" height="14" fill="#e6edf3" class="cursor" />
</svg>
