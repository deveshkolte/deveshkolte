<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="72%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="scanLine" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="40" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181b" stroke-width="0.7" opacity="0.65" />
      <circle cx="32" cy="32" r="0.9" fill="#27272a" />
    </pattern>

    <clipPath id="typeClip">
      <rect x="44" y="196" height="32" width="0">
        <animate attributeName="width" values="0;405;405;0" keyTimes="0;0.45;0.88;1" dur="6s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes sweepHorizontal {
        0% { transform: translateX(-380px); opacity: 0.2; }
        50% { opacity: 1; }
        100% { transform: translateX(380px); opacity: 0.2; }
      }
      @keyframes sweepVertical {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 0.45; }
        80% { opacity: 0.45; }
        100% { transform: translateY(290px); opacity: 0; }
      }
      .ring-outer {
        transform-origin: 650px 154px;
        animation: spinCW 22s linear infinite;
      }
      .ring-mid {
        transform-origin: 650px 154px;
        animation: spinCCW 14s linear infinite;
      }
      .ring-inner {
        transform-origin: 650px 154px;
        animation: spinCW 8s linear infinite;
      }
      .top-beam {
        animation: sweepHorizontal 4.5s ease-in-out infinite alternate;
      }
      .v-scan {
        animation: sweepVertical 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="url(#bg)" stroke="#27272a" stroke-width="1" />
  <rect x="1" y="1" width="878" height="298" rx="14" fill="url(#techGrid)" />
  <rect x="1" y="1" width="878" height="298" rx="14" fill="url(#coreGlow)" />

  <!-- Subtle Vertical Laser Scan Across Grid -->
  <line x1="1" y1="4" x2="879" y2="4" stroke="url(#scanLine)" stroke-width="1" class="v-scan" />

  <!-- Top Laser Accent -->
  <rect x="100" y="0.5" width="680" height="1.8" fill="url(#scanLine)" class="top-beam" />

  <!-- ================= LEFT: IDENTITY, THESIS & KINETIC WAVEFORM ================= -->
  <text x="44" y="72" fill="#fafafa" font-size="34" font-weight="800" letter-spacing="-1" class="sans">DEVESH KOLTE</text>
  <text x="44" y="98" fill="#10b981" font-size="12" font-weight="600" letter-spacing="0.6" class="mono">AI AGENT ORCHESTRATION · RAG DIAGNOSTICS · DEVTOOLS</text>

  <text x="44" y="130" fill="#a1a1aa" font-size="13" class="sans">Building deterministic evaluation engines, multi-agent pipelines,</text>
  <text x="44" y="150" fill="#a1a1aa" font-size="13" class="sans">MCP servers, and local-first software that ship to production.</text>

  <!-- Live Typewriter Terminal Strip -->
  <rect x="44" y="176" width="420" height="52" rx="8" fill="#0d0d12" stroke="#27272a" stroke-width="1" />
  <text x="58" y="195" fill="#52525b" font-size="9.5" font-weight="600" letter-spacing="0.8" class="mono">RUNTIME EXECUTION STREAM</text>
  <g clip-path="url(#typeClip)">
    <text x="58" y="214" fill="#34d399" font-size="11.5" font-weight="600" class="mono">&gt; deterministic_verify --zero-llm-judges --cpu</text>
  </g>
  <!-- Animated Morphing Sine Waveform Underneath -->
  <path stroke="url(#waveGrad)" stroke-width="1.8" fill="none" stroke-linecap="round">
    <animate attributeName="d"
      dur="3.2s"
      repeatCount="indefinite"
      values="
        M 44 256 Q 96 240, 148 256 T 252 256 T 356 256 T 460 256;
        M 44 256 Q 96 272, 148 256 T 252 256 T 356 256 T 460 256;
        M 44 256 Q 96 240, 148 256 T 252 256 T 356 256 T 460 256" />
  </path>
  <path stroke="#10b981" stroke-width="1" opacity="0.4" fill="none" stroke-dasharray="3 5">
    <animate attributeName="d"
      dur="2.4s"
      repeatCount="indefinite"
      values="
        M 44 256 Q 96 268, 148 256 T 252 256 T 356 256 T 460 256;
        M 44 256 Q 96 244, 148 256 T 252 256 T 356 256 T 460 256;
        M 44 256 Q 96 268, 148 256 T 252 256 T 356 256 T 460 256" />
  </path>

  <!-- ================= RIGHT: ROTATING ORBITAL TELEMETRY REACTOR (cx=650, cy=154) ================= -->
  <!-- Static Crosshairs -->
  <line x1="510" y1="154" x2="790" y2="154" stroke="#18181b" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="650" y1="24" x2="650" y2="284" stroke="#18181b" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Outer Counter-Rotating Segmented Ring (r=112) -->
  <g class="ring-outer">
    <circle cx="650" cy="154" r="112" stroke="#27272a" stroke-width="1.2" stroke-dasharray="48 16 12 16" fill="none" />
    <circle cx="650" cy="42" r="4" fill="#10b981" />
    <circle cx="650" cy="266" r="3" fill="#34d399" opacity="0.7" />
    <circle cx="538" cy="154" r="3" fill="#34d399" opacity="0.7" />
  </g>

  <!-- Middle Counter-Rotating Telemetry Ring (r=82) -->
  <g class="ring-mid">
    <circle cx="650" cy="154" r="82" stroke="#065f46" stroke-width="1.6" stroke-dasharray="32 22 8 22" fill="none" />
    <circle cx="732" cy="154" r="3.5" fill="#34d399" />
    <circle cx="568" cy="154" r="3.5" fill="#10b981" />
  </g>

  <!-- Inner High-Speed Scanner Ring (r=54) -->
  <g class="ring-inner">
    <circle cx="650" cy="154" r="54" stroke="#10b981" stroke-width="1.8" stroke-dasharray="26 60" stroke-linecap="round" fill="none" />
    <circle cx="650" cy="100" r="3" fill="#6ee7b7" />
  </g>

  <!-- Expanding Sonar Pulse from Core -->
  <circle cx="650" cy="154" r="22" stroke="#10b981" stroke-width="1.2" fill="none">
    <animate attributeName="r" values="22;108" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.75;0" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="154" r="22" stroke="#34d399" stroke-width="1" fill="none">
    <animate attributeName="r" values="22;108" dur="3.2s" begin="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0" dur="3.2s" begin="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- Center Core Hub -->
  <circle cx="650" cy="154" r="28" fill="#09090b" stroke="#10b981" stroke-width="1.5" />

  <!-- Live Spectrum Bars Inside Core -->
  <rect x="635" y="146" width="3.5" height="16" rx="1.5" fill="#10b981">
    <animate attributeName="height" values="8;22;12;8" dur="1.1s" repeatCount="indefinite" />
    <animate attributeName="y" values="150;143;148;150" dur="1.1s" repeatCount="indefinite" />
  </rect>
  <rect x="642" y="142" width="3.5" height="24" rx="1.5" fill="#34d399">
    <animate attributeName="height" values="24;10;20;24" dur="0.9s" repeatCount="indefinite" />
    <animate attributeName="y" values="142;149;144;142" dur="0.9s" repeatCount="indefinite" />
  </rect>
  <rect x="649" y="140" width="3.5" height="28" rx="1.5" fill="#6ee7b7">
    <animate attributeName="height" values="12;28;16;12" dur="1.3s" repeatCount="indefinite" />
    <animate attributeName="y" values="148;140;146;148" dur="1.3s" repeatCount="indefinite" />
  </rect>
  <rect x="656" y="144" width="3.5" height="20" rx="1.5" fill="#34d399">
    <animate attributeName="height" values="20;8;24;20" dur="1.0s" repeatCount="indefinite" />
    <animate attributeName="y" values="144;150;142;144" dur="1.0s" repeatCount="indefinite" />
  </rect>
  <rect x="663" y="148" width="3.5" height="12" rx="1.5" fill="#10b981">
    <animate attributeName="height" values="10;20;8;10" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="149;144;150;149" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <!-- Floating HUD Telemetry Labels Around Orbital Reactor -->
  <rect x="492" y="34" width="108" height="22" rx="5" fill="#0d0d12" stroke="#27272a" stroke-width="1" />
  <text x="502" y="48.5" fill="#34d399" font-size="9.5" font-weight="600" class="mono">0.19ms TRACE</text>

  <rect x="716" y="34" width="118" height="22" rx="5" fill="#0d0d12" stroke="#27272a" stroke-width="1" />
  <text x="726" y="48.5" fill="#e4e4e7" font-size="9.5" font-weight="600" class="mono">50/50 MCP SDK</text>

  <rect x="492" y="248" width="118" height="22" rx="5" fill="#0d0d12" stroke="#27272a" stroke-width="1" />
  <text x="502" y="262.5" fill="#e4e4e7" font-size="9.5" font-weight="600" class="mono">100% SQUAD v1</text>

  <rect x="716" y="248" width="118" height="22" rx="5" fill="#0d0d12" stroke="#27272a" stroke-width="1" />
  <text x="726" y="262.5" fill="#34d399" font-size="9.5" font-weight="600" class="mono">83% B2B RECON</text>
</svg>
