<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 148" width="100%" height="148" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      @keyframes pulseBorder {
        0%, 100% { stroke: #27272a; }
        50% { stroke: #10b981; }
      }
      .frame { animation: pulseBorder 5s ease-in-out 2.4s infinite; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="429" height="147" rx="10" fill="#09090b" stroke="#27272a" stroke-width="1.2" class="frame" />

  <text x="22" y="32" fill="#fafafa" font-size="16" font-weight="700" class="sans">ColdForge</text>
  <rect x="304" y="17" width="104" height="20" rx="5" fill="#052e16" stroke="#065f46" stroke-width="0.9" />
  <text x="314" y="30.5" fill="#34d399" font-size="10" font-weight="600" class="mono">83% RESOLVED</text>

  <text x="22" y="55" fill="#a1a1aa" font-size="11.5" class="sans">Self-hosted 4-agent B2B recon, 5-tier contact provenance,</text>
  <text x="22" y="72" fill="#a1a1aa" font-size="11.5" class="sans">deterministic hallucination guard &amp; DKIM/SMTP engine.</text>

  <!-- Animated Benchmark Delta Bar -->
  <rect x="22" y="88" width="386" height="24" rx="5" fill="#111116" stroke="#1f1f25" stroke-width="1" />
  <text x="32" y="104" fill="#71717a" font-size="9.5" class="mono">N=100 Benchmark</text>
  <rect x="150" y="96" width="160" height="8" rx="4" fill="#1f1f25" />
  <rect x="150" y="96" width="133" height="8" rx="4" fill="#10b981">
    <animate attributeName="width" values="59;133;133;59" dur="4s" repeatCount="indefinite" />
  </rect>
  <text x="322" y="104" fill="#34d399" font-size="9.5" font-weight="600" class="mono">37% → 83%</text>

  <text x="22" y="132" fill="#71717a" font-size="10.2" class="mono">Node.js v24 · SQLite WAL · Ollama · 2048-bit DKIM · AES-256-GCM</text>
</svg>
