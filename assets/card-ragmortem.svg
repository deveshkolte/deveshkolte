<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 148" width="100%" height="148" fill="none">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      @keyframes pulseBorder {
        0%, 100% { stroke: #27272a; }
        50% { stroke: #10b981; }
      }
      .frame { animation: pulseBorder 5s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="429" height="147" rx="10" fill="#09090b" stroke="#27272a" stroke-width="1.2" class="frame" />
  
  <text x="22" y="32" fill="#fafafa" font-size="16" font-weight="700" class="sans">RAGmortem</text>
  <rect x="314" y="17" width="94" height="20" rx="5" fill="#052e16" stroke="#065f46" stroke-width="0.9" />
  <text x="324" y="30.5" fill="#34d399" font-size="10" font-weight="600" class="mono">0.19ms CPU</text>

  <text x="22" y="55" fill="#a1a1aa" font-size="11.5" class="sans">Offline root-cause debugger for RAG pipelines. Isolates</text>
  <text x="22" y="72" fill="#a1a1aa" font-size="11.5" class="sans">retrieval misses, top-k ranking truncation &amp; hallucinations.</text>

  <!-- Animated Top-K Cutoff Mini Telemetry Bar -->
  <rect x="22" y="88" width="386" height="24" rx="5" fill="#111116" stroke="#1f1f25" stroke-width="1" />
  <text x="32" y="104" fill="#71717a" font-size="9.5" class="mono">SQuAD v1.1 (50/50)</text>
  <rect x="150" y="96" width="170" height="8" rx="4" fill="#1f1f25" />
  <rect x="150" y="96" width="170" height="8" rx="4" fill="#10b981">
    <animate attributeName="width" values="120;170;170;120" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <text x="332" y="104" fill="#34d399" font-size="9.5" font-weight="600" class="mono">100% PASS</text>

  <text x="22" y="132" fill="#71717a" font-size="10.2" class="mono">Python · Local NLI · ScoreCalibrator · OpenTelemetry · 192 Tests</text>
</svg>
