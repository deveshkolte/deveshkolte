<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 340" width="100%" height="340" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="55%" stop-color="#0b0b0f" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="topBeam" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141419" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#101014" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18181b" stroke-width="0.7" opacity="0.6" />
      <circle cx="24" cy="24" r="0.8" fill="#27272a" />
    </pattern>

    <!-- Data flow wire paths from Left Hub (x=312, y=195) to Right System Cards (x=422) -->
    <path id="wire1" d="M 312 175 C 362 175, 368 96, 422 96" />
    <path id="wire2" d="M 312 188 C 362 188, 368 158, 422 158" />
    <path id="wire3" d="M 312 202 C 362 202, 368 220, 422 220" />
    <path id="wire4" d="M 312 215 C 362 215, 368 282, 422 282" />

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

      @keyframes dashStream {
        to { stroke-dashoffset: -28; }
      }
      @keyframes scanBeam {
        0% { transform: translateX(-340px); opacity: 0.25; }
        50% { opacity: 1; }
        100% { transform: translateX(340px); opacity: 0.25; }
      }
      @keyframes nodeHighlight1 {
        0%, 100% { stroke: #27272a; }
        10%, 28% { stroke: #10b981; }
      }
      @keyframes nodeHighlight2 {
        0%, 100% { stroke: #27272a; }
        32%, 50% { stroke: #10b981; }
      }
      @keyframes nodeHighlight3 {
        0%, 100% { stroke: #27272a; }
        55%, 73% { stroke: #10b981; }
      }
      @keyframes nodeHighlight4 {
        0%, 100% { stroke: #27272a; }
        78%, 96% { stroke: #10b981; }
      }
      .wire-stream {
        stroke-dasharray: 5 9;
        animation: dashStream 1.4s linear infinite;
      }
      .beam {
        animation: scanBeam 5s ease-in-out infinite alternate;
      }
      .node-1 { animation: nodeHighlight1 7.2s infinite; }
      .node-2 { animation: nodeHighlight2 7.2s infinite; }
      .node-3 { animation: nodeHighlight3 7.2s infinite; }
      .node-4 { animation: nodeHighlight4 7.2s infinite; }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect x="0.5" y="0.5" width="879" height="339" rx="12" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1" />
  <rect x="1" y="1" width="878" height="338" rx="12" fill="url(#grid)" />

  <!-- Subtle Ambient Glow Behind Orchestrator Hub -->
  <circle cx="170" cy="195" r="145" fill="url(#emeraldGlow)" />

  <!-- Animated Top Laser Beam -->
  <rect x="80" y="0.5" width="720" height="1.5" fill="url(#topBeam)" class="beam" />

  <!-- Window Header Bar -->
  <line x1="1" y1="38" x2="879" y2="38" stroke="#1f1f23" stroke-width="1" />
  <circle cx="22" cy="19" r="4.5" fill="#27272a" />
  <circle cx="36" cy="19" r="4.5" fill="#27272a" />
  <circle cx="50" cy="19" r="4.5" fill="#27272a" />
  <text x="68" y="23" fill="#71717a" font-size="11" class="mono">deveshkolte // deterministic-ai-and-agent-systems</text>

  <!-- Right Live Radar Pill -->
  <rect x="698" y="9.5" width="158" height="19" rx="9.5" fill="#111115" stroke="#27272a" stroke-width="1" />
  <circle cx="712" cy="19" r="3" fill="#10b981" />
  <circle cx="712" cy="19" r="3" stroke="#10b981" stroke-width="1.2" fill="none">
    <animate attributeName="r" values="3;8.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="724" y="22.5" fill="#e4e4e7" font-size="9.8" font-weight="600" letter-spacing="0.5" class="mono">BENGALURU · LIVE</text>

  <!-- ================= LEFT: IDENTITY & CORE RUNTIME HUB ================= -->
  <text x="28" y="78" fill="#fafafa" font-size="27" font-weight="700" letter-spacing="-0.6" class="sans">DEVESH KOLTE</text>
  <text x="28" y="100" fill="#10b981" font-size="11" font-weight="600" class="mono">AI Orchestration · RAG Diagnostics · DevTools</text>
  <text x="28" y="122" fill="#a1a1aa" font-size="11.5" class="sans">Engineering deterministic evaluation engines, multi-agent</text>
  <text x="28" y="138" fill="#a1a1aa" font-size="11.5" class="sans">pipelines, and local-first developer infrastructure.</text>

  <!-- Core Runtime Hub Node (x=28..312, y=154..312) -->
  <rect x="28" y="154" width="284" height="156" rx="10" fill="url(#hubGrad)" stroke="#27272a" stroke-width="1.2" />
  <line x1="28" y1="180" x2="312" y2="180" stroke="#1f1f23" stroke-width="1" />
  <circle cx="44" cy="167" r="3.5" fill="#10b981" />
  <text x="55" y="170.5" fill="#d4d4d8" font-size="10" font-weight="600" letter-spacing="0.6" class="mono">CORE ARCHITECTURE STACK</text>

  <!-- Stack Pills inside Hub -->
  <rect x="42" y="192" width="124" height="24" rx="5" fill="#18181c" stroke="#27272a" stroke-width="1" />
  <text x="52" y="207.5" fill="#e4e4e7" font-size="10.2" font-weight="600" class="mono">Python 3.11+</text>

  <rect x="174" y="192" width="124" height="24" rx="5" fill="#18181c" stroke="#27272a" stroke-width="1" />
  <text x="184" y="207.5" fill="#e4e4e7" font-size="10.2" font-weight="600" class="mono">TypeScript 5</text>

  <rect x="42" y="224" width="124" height="24" rx="5" fill="#18181c" stroke="#27272a" stroke-width="1" />
  <text x="52" y="239.5" fill="#34d399" font-size="10.2" font-weight="600" class="mono">MCP JSON-RPC</text>

  <rect x="174" y="224" width="124" height="24" rx="5" fill="#18181c" stroke="#27272a" stroke-width="1" />
  <text x="184" y="239.5" fill="#34d399" font-size="10.2" font-weight="600" class="mono">RAG / Local NLI</text>

  <rect x="42" y="256" width="124" height="24" rx="5" fill="#18181c" stroke="#27272a" stroke-width="1" />
  <text x="52" y="271.5" fill="#a1a1aa" font-size="10.2" class="mono">Node.js SQLite</text>

  <rect x="174" y="256" width="124" height="24" rx="5" fill="#18181c" stroke="#27272a" stroke-width="1" />
  <text x="184" y="271.5" fill="#a1a1aa" font-size="10.2" class="mono">FastAPI · Next</text>

  <text x="42" y="298" fill="#71717a" font-size="9.8" class="mono">100% local-first · zero black-box LLM judges</text>

  <!-- Output Port Nodes on Right Edge of Hub -->
  <circle cx="312" cy="175" r="3.5" fill="#10b981" />
  <circle cx="312" cy="188" r="3.5" fill="#10b981" />
  <circle cx="312" cy="202" r="3.5" fill="#10b981" />
  <circle cx="312" cy="215" r="3.5" fill="#10b981" />

  <!-- ================= CENTER: ANIMATED DATA-FLOW CIRCUIT WIRES ================= -->
  <!-- Base Wire Tracks -->
  <use href="#wire1" stroke="#1f1f25" stroke-width="1.8" fill="none" />
  <use href="#wire2" stroke="#1f1f25" stroke-width="1.8" fill="none" />
  <use href="#wire3" stroke="#1f1f25" stroke-width="1.8" fill="none" />
  <use href="#wire4" stroke="#1f1f25" stroke-width="1.8" fill="none" />

  <!-- Animated Dashed Signal Streams -->
  <use href="#wire1" stroke="#065f46" stroke-width="1.5" fill="none" class="wire-stream" />
  <use href="#wire2" stroke="#065f46" stroke-width="1.5" fill="none" class="wire-stream" />
  <use href="#wire3" stroke="#065f46" stroke-width="1.5" fill="none" class="wire-stream" />
  <use href="#wire4" stroke="#065f46" stroke-width="1.5" fill="none" class="wire-stream" />

  <!-- Travelling Glowing Data Packets (SMIL animateMotion) -->
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wire1" />
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wire2" />
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wire3" />
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wire4" />
    </animateMotion>
  </circle>

  <!-- ================= RIGHT: 4 FLAGSHIP SYSTEM NODES ================= -->
  <text x="422" y="60" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.8" class="mono">PRODUCTION SYSTEMS &amp; PUBLISHED PACKAGES</text>

  <!-- Node 1: RAGmortem (y=69..121) -->
  <rect x="422" y="69" width="430" height="52" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.2" class="node-1" />
  <circle cx="422" cy="96" r="3.5" fill="#10b981" />
  <text x="438" y="90" fill="#10b981" font-size="11" font-weight="700" class="mono">01</text>
  <text x="460" y="90" fill="#fafafa" font-size="13" font-weight="700" class="sans">RAGmortem</text>
  <text x="546" y="90" fill="#71717a" font-size="10.5" class="mono">pip install ragmortem</text>
  <rect x="748" y="76" width="92" height="19" rx="4" fill="#052e16" stroke="#065f46" stroke-width="0.9" />
  <text x="758" y="89" fill="#34d399" font-size="9.8" font-weight="600" class="mono">0.19ms CPU</text>
  <text x="460" y="109" fill="#a1a1aa" font-size="11" class="sans">Deterministic RAG root-cause debugger · ScoreCalibrator + Local NLI</text>

  <!-- Node 2: ColdForge (y=131..183) -->
  <rect x="422" y="131" width="430" height="52" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.2" class="node-2" />
  <circle cx="422" cy="158" r="3.5" fill="#10b981" />
  <text x="438" y="152" fill="#10b981" font-size="11" font-weight="700" class="mono">02</text>
  <text x="460" y="152" fill="#fafafa" font-size="13" font-weight="700" class="sans">ColdForge</text>
  <text x="534" y="152" fill="#71717a" font-size="10.5" class="mono">4-Agent Recon · DKIM/SMTP</text>
  <rect x="748" y="138" width="92" height="19" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.9" />
  <text x="756" y="151" fill="#e4e4e7" font-size="9.8" font-weight="600" class="mono">83% Verified</text>
  <text x="460" y="171" fill="#a1a1aa" font-size="11" class="sans">5-tier contact provenance, hallucination guard &amp; AES-256-GCM vault</text>

  <!-- Node 3: Unscrape SDK (y=193..245) -->
  <rect x="422" y="193" width="430" height="52" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.2" class="node-3" />
  <circle cx="422" cy="220" r="3.5" fill="#10b981" />
  <text x="438" y="214" fill="#10b981" font-size="11" font-weight="700" class="mono">03</text>
  <text x="460" y="214" fill="#fafafa" font-size="13" font-weight="700" class="sans">Unscrape SDK</text>
  <text x="564" y="214" fill="#71717a" font-size="10.5" class="mono">MCP Server · Playwright</text>
  <rect x="748" y="200" width="92" height="19" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.9" />
  <text x="762" y="213" fill="#e4e4e7" font-size="9.8" font-weight="600" class="mono">50/50 Pass</text>
  <text x="460" y="233" fill="#a1a1aa" font-size="11" class="sans">XHR/Next.js state interception, 7-metro GPS spoofing &amp; price watchdog</text>

  <!-- Node 4: FareSnap (y=255..307) -->
  <rect x="422" y="255" width="430" height="52" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.2" class="node-4" />
  <circle cx="422" cy="282" r="3.5" fill="#10b981" />
  <text x="438" y="276" fill="#10b981" font-size="11" font-weight="700" class="mono">04</text>
  <text x="460" y="276" fill="#fafafa" font-size="13" font-weight="700" class="sans">FareSnap</text>
  <text x="530" y="276" fill="#71717a" font-size="10.5" class="mono">React Native · ONDC Beckn</text>
  <rect x="748" y="262" width="92" height="19" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="0.9" />
  <text x="768" y="275" fill="#e4e4e7" font-size="9.8" font-weight="600" class="mono">9 Cities</text>
  <text x="460" y="295" fill="#a1a1aa" font-size="11" class="sans">Haversine Metro+Auto split routes, Supabase surge pool &amp; rain radar</text>
</svg>
