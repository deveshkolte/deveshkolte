<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 156" width="100%" height="156" fill="none">
  <defs>
    <clipPath id="cmdClip">
      <rect x="44" y="34" height="22" width="0">
        <animate attributeName="width" values="0;410;410;410;0" keyTimes="0;0.22;0.88;0.96;1" dur="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes reveal1 { 0%, 24% { opacity: 0; transform: translateY(3px); } 30%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
      @keyframes reveal2 { 0%, 36% { opacity: 0; transform: translateY(3px); } 42%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
      @keyframes reveal3 { 0%, 48% { opacity: 0; transform: translateY(3px); } 54%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
      .r1 { animation: reveal1 8s ease-out infinite; }
      .r2 { animation: reveal2 8s ease-out infinite; }
      .r3 { animation: reveal3 8s ease-out infinite; }
    </style>
  </defs>

  <!-- Subtle Terminal Window integrated seamlessly into README -->
  <rect x="0.5" y="0.5" width="839" height="155" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <line x1="1" y1="28" x2="839" y2="28" stroke="#21262d" stroke-width="1" />
  <circle cx="16" cy="14" r="4.5" fill="#ff5f56" opacity="0.85" />
  <circle cx="30" cy="14" r="4.5" fill="#ffbd2e" opacity="0.85" />
  <circle cx="44" cy="14" r="4.5" fill="#27c93f" opacity="0.85" />
  <text x="64" y="18" fill="#8b949e" font-size="11" class="mono">zsh — deveshkolte@macbook-pro</text>

  <!-- Prompt & Typewriter Command -->
  <text x="20" y="50" fill="#3fb950" font-size="12.5" font-weight="600" class="mono">➜</text>
  <text x="34" y="50" fill="#58a6ff" font-size="12.5" font-weight="600" class="mono">~</text>
  <g clip-path="url(#cmdClip)">
    <text x="48" y="50" fill="#f0f6fc" font-size="12.5" class="mono">ragmortem diagnose trace.json --profile bge</text>
  </g>

  <!-- Output Tree -->
  <g class="r1">
    <text x="20" y="78" fill="#8b949e" font-size="12" class="mono">├─</text>
    <text x="44" y="78" fill="#c9d1d9" font-size="12" class="mono">calibration</text>
    <text x="160" y="78" fill="#3fb950" font-size="12" class="mono">PASS</text>
    <text x="212" y="78" fill="#8b949e" font-size="12" class="mono">empirical z-score normalized (MiniLM / OpenAI / BGE)</text>
  </g>

  <g class="r2">
    <text x="20" y="102" fill="#8b949e" font-size="12" class="mono">├─</text>
    <text x="44" y="102" fill="#c9d1d9" font-size="12" class="mono">nli_entailment</text>
    <text x="160" y="102" fill="#3fb950" font-size="12" class="mono">PASS</text>
    <text x="212" y="102" fill="#8b949e" font-size="12" class="mono">local cross-encoder verified in 0.19 ms (CPU-only)</text>
  </g>

  <g class="r3">
    <text x="20" y="128" fill="#8b949e" font-size="12" class="mono">└─</text>
    <text x="44" y="128" fill="#c9d1d9" font-size="12" class="mono">root_cause</text>
    <text x="160" y="128" fill="#d29922" font-size="12" font-weight="600" class="mono">RANKING_MISS</text>
    <text x="268" y="128" fill="#f0f6fc" font-size="12" class="mono">gold chunk truncated at top-k=3 (100% SQuAD v1.1)</text>
  </g>
</svg>
