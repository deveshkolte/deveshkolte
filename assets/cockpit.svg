<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="420" fill="none">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }

      /* 12-second 4-stage Telescope selection cursor movement (3s per project) */
      @keyframes moveCursor {
        0%, 24.9%   { transform: translateY(0px); }
        25%, 49.9%  { transform: translateY(38px); }
        50%, 74.9%  { transform: translateY(76px); }
        75%, 100%   { transform: translateY(114px); }
      }

      /* Synchronized Right-Pane Preview Pages */
      @keyframes page1 {
        0%, 24%    { opacity: 1; }
        25%, 100%  { opacity: 0; }
      }
      @keyframes page2 {
        0%, 24.9%  { opacity: 0; }
        25%, 49%   { opacity: 1; }
        50%, 100%  { opacity: 0; }
      }
      @keyframes page3 {
        0%, 49.9%  { opacity: 0; }
        50%, 74%   { opacity: 1; }
        75%, 100%  { opacity: 0; }
      }
      @keyframes page4 {
        0%, 74.9%  { opacity: 0; }
        75%, 99%   { opacity: 1; }
        100%       { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulseBar {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.45; }
      }

      .cursor-bar { animation: moveCursor 12s infinite; }
      .preview-1 { animation: page1 12s infinite; }
      .preview-2 { animation: page2 12s infinite; }
      .preview-3 { animation: page3 12s infinite; }
      .preview-4 { animation: page4 12s infinite; }
      .caret { animation: blink 1s step-end infinite; }
      .pulse { animation: pulseBar 2.2s ease-in-out infinite; }
    </style>
  </defs>

